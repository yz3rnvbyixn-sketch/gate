name: VPN Gate Node Check

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gate-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Get VPN Gate nodes + check via Cloudflare Worker + build page
        run: python vpngate.py
        env:
          # 已部署的检测 Worker (不要改动: 检测统一走这里)
          CHECK_WORKER: ${{ secrets.DOMAIN }}
          CHECK_CONCURRENCY: "32"
          CHECK_TIMEOUT: "90"
          MAX_LATENCY: "0"
          MAX_PER_COUNTRY: "15"
          HOSTS_ENTRY: "103.22.202.243:443,173.245.63.169:443,173.245.61.110:443,173.245.48.182:443,103.21.246.160:443,103.21.244.65:443,173.245.60.61:443,103.31.5.145:443,173.245.50.225:443,173.245.62.3:443,103.22.203.55:443,103.22.201.175:443,103.22.200.159:443,103.21.247.108:443,198.41.135.215:443,103.31.4.182:443,173.245.49.126:443,103.31.6.184:443,173.245.57.214:443,103.21.245.105:443,173.245.56.126:443,173.245.52.248:443,173.245.51.170:443,108.162.212.215:443,141.101.126.58:443,173.245.58.252:443,141.101.115.196:443,173.245.53.108:443,108.162.201.130:443,173.245.59.114:443,173.245.55.158:443,141.101.105.154:443,173.245.54.39:443,108.162.213.38:443,141.101.83.245:443,141.101.110.99:443,190.93.240.188:443,197.234.240.207:443,188.114.101.163:443,108.162.202.166:443,141.101.111.9:443,141.101.127.39:443,141.101.72.59:443,141.101.121.8:443,141.101.113.123:443,190.93.250.60:443,141.101.84.172:443,141.101.106.7:443,141.101.73.93:443,197.234.241.2:443,108.162.214.175:443,141.101.114.140:443,108.162.196.76:443,188.114.102.52:443,141.101.116.83:443,103.31.7.240:443,141.101.117.150:443,141.101.85.76:443,190.93.241.142:443,141.101.107.240:443,141.101.74.62:443,190.93.251.2:443,108.162.203.233:443,197.234.242.129:443,188.114.103.69:443,198.41.130.196:443,108.162.192.250:443,141.101.112.56:443,108.162.215.163:443,141.101.118.40:443,141.101.122.64:443,141.101.86.38:443,141.101.75.127:443,190.93.242.237:443,141.101.108.222:443,108.162.197.86:443,141.101.64.84:443,197.234.243.129:443,190.93.252.97:443,198.41.131.10:443,188.114.108.96:443,108.162.216.200:443,141.101.123.56:443,141.101.119.112:443,108.162.204.40:443,190.93.243.177:443,141.101.87.95:443,188.114.104.16:443,108.162.193.170:443,141.101.109.131:443,108.162.198.129:443,141.101.65.181:443,141.101.76.19:443,190.93.253.146:443,198.41.132.89:443,198.41.128.77:443,141.101.124.60:443,190.93.244.213:443,188.114.109.76:443,188.114.105.175:443"

      - name: Ensure GitHub Pages is enabled (one-time auto setup)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          echo "Pages API status: $code"
          if [ "$code" = "404" ]; then
            echo "首次运行: 启用 GitHub Pages (source = GitHub Actions, 目录 /public)"
            curl -sS -X PUT \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"build_type":"workflow","source":{"branch":"main","path":"/"}}' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/pages"
            echo
            sleep 10
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Show site URL
        run: 'echo "site: https://yz3rnvbyixn-sketch.github.io/gate/ (deploy outcome: ${{ steps.deployment.outcome }})"'
